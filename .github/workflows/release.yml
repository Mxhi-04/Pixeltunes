name: Release PixelTunes Desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version in MAJOR.MINOR.PATCH format'
        required: true
        type: string
      spotify_verified:
        description: 'Fresh-account Spotify sign-in, playlists and playback verified on macOS and Windows'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  validate:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
      SPOTIFY_PUBLIC_ACCESS_APPROVED: ${{ vars.SPOTIFY_PUBLIC_ACCESS_APPROVED }}
      SPOTIFY_VERIFIED: ${{ inputs.spotify_verified }}
    steps:
      - name: Check public release prerequisites
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Use a release version in MAJOR.MINOR.PATCH format."
            exit 1
          fi
          if ! [[ "$SPOTIFY_CLIENT_ID" =~ ^[[:xdigit:]]{32}$ && "$SPOTIFY_PUBLIC_ACCESS_APPROVED" == true && "$SPOTIFY_VERIFIED" == true ]]; then
            echo "::error::Configure a Spotify Client ID with public access and verify live sign-in, playlists and playback before releasing."
            exit 1
          fi

  package:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            asset: macos-arm64
            arch: arm64
          - os: macos-15-intel
            asset: macos-x64
            arch: x64
          - os: windows-latest
            asset: windows-x64
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      VITE_SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
      ARCH: ${{ matrix.arch }}
      ASSET: ${{ matrix.asset }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm version "$RELEASE_VERSION" --no-git-tag-version --ignore-scripts
        shell: bash
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm test
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: |
          npm run package:mac -- "$ARCH"
          bundle="release/PixelTunes-darwin-$ARCH/PixelTunes.app"
          codesign --verify --deep --strict "$bundle"
          ditto -c -k --sequesterRsrc --keepParent "$bundle" "PixelTunes-$ASSET.zip"
      - name: Archive Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm run package:windows -- $env:ARCH
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bundle = "release/PixelTunes-win32-$env:ARCH"
          if (!(Test-Path "$bundle/PixelTunes.exe")) { throw "Missing PixelTunes.exe" }
          Compress-Archive -Path $bundle -DestinationPath "PixelTunes-$env:ASSET.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: PixelTunes-${{ matrix.asset }}.zip
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: archives
          merge-multiple: true
      - name: Commit the version and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ! git show-ref --verify --quiet "refs/tags/v$RELEASE_VERSION"
          npm version "$RELEASE_VERSION" --no-git-tag-version --ignore-scripts
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m "chore(release): v$RELEASE_VERSION"
          git tag "v$RELEASE_VERSION"
          git push --atomic origin "HEAD:refs/heads/$GITHUB_REF_NAME" "refs/tags/v$RELEASE_VERSION"
          gh release create "v$RELEASE_VERSION" archives/PixelTunes-*.zip --verify-tag --generate-notes
